name: democracy

x-environment: &shared-environment
  SENTRY_DSN: ${SENTRY_DSN}
  SENTRY_RELEASE: ${SENTRY_RELEASE}
  SECRET_KEY: ${SECRET_KEY}
  DEBUG: ${DEBUG}
  MODE: ${MODE}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  ORIGINS: ${ORIGINS}
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_HOST: "db"
  DB_PORT: "5432"

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  web:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    container_name: democracy_web
    command: uvicorn project.asgi:application --host 0.0.0.0 --port 8000 --workers 3
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      <<: *shared-environment
    env_file:
      - .env

  celery:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    command: celery -A project worker --loglevel=info
    volumes:
      - .:/app
    environment:
      <<: *shared-environment
    depends_on:
      - db
      - redis
      - web

  celery_beat:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    command: celery -A project beat --loglevel=info
    volumes:
      - .:/app
    environment:
      <<: *shared-environment
    depends_on:
      - db
      - redis
      - web
      - celery

  flower:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    command: celery -A project flower --port=5555
    ports:
      - "5555:5555"
    environment:
      <<: *shared-environment
    depends_on:
      - db
      - redis
      - web
      - celery
      - celery_beat

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - web

volumes:
  postgres_data: