name: democracy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-environment: &shared-environment
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  DEBUG: ${DEBUG:-0}
  MODE: ${MODE:-production}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
  ORIGINS: ${ORIGINS:-}

  DB_NAME: ${DB_NAME:?DB_NAME is required}
  DB_USER: ${DB_USER:?DB_USER is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_HOST: db
  DB_PORT: "5432"

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend
    logging: *default-logging

    # Uncomment only if you need local direct DB access.
    # Binds to localhost only, not publicly.
    # ports:
    #   - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend
    logging: *default-logging

    # Uncomment only if you need local direct Redis access.
    # Binds to localhost only, not publicly.
    # ports:
    #   - "127.0.0.1:6379:6379"

  web:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    restart: unless-stopped
    command:
      - uvicorn
      - project.asgi:application
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "3"
      - --proxy-headers
      - --forwarded-allow-ips=*
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *shared-environment
      RUN_DB_SETUP: ${RUN_DB_SETUP:-true}
      LOAD_FIXTURES: ${LOAD_FIXTURES:-true}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - backend
    logging: *default-logging

    # If you need direct local access to Django/Uvicorn:
    # ports:
    #   - "127.0.0.1:8000:8000"

    # If your app stores user-uploaded media files:
    # volumes:
    #   - media_data:/democracy/media

  celery:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    restart: unless-stopped
    command:
      - celery
      - "-A"
      - project
      - worker
      - --loglevel=info
      - --queues=celery
      - --concurrency=8
      - --prefetch-multiplier=1
      - --max-tasks-per-child=1000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      <<: *shared-environment
      RUN_DB_SETUP: "false"
      LOAD_FIXTURES: "false"
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    logging: *default-logging

    # Development-only bind mount.
    # Only use this if you want live code reloading for Celery workers.
    # Remove in production.
    #
    # If compose.yml is inside docker/, use:
    #   - ..:/democracy
    #
    # If compose.yml is at repository root, use:
    #   - .:/democracy
    #
    # volumes:
    #   - ..:/democracy

#  ollama:
