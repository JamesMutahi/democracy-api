    # Uncomment if you have an NVIDIA GPU and the NVIDIA Container Toolkit installed.
    #
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

#  ollama_pull:
#    image: ollama/ollama
#    restart: "no"
#    depends_on:
#      ollama:
#        condition: service_healthy
#    environment:
#      OLLAMA_HOST: http://ollama:11434
#    command:
#      - sh
#      - -c
#      - ollama pull ${LOCAL_QWEN_MODEL:-qwen2.5:7b-instruct}
#    networks:
#      - backend
#    logging: *default-logging

  celery_summarization:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    restart: unless-stopped
    command:
      - celery
      - "-A"
      - project
      - worker
      - --loglevel=info
      - --queues=summarization
      - --concurrency=1
      - --prefetch-multiplier=1
      - --max-tasks-per-child=50
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
#      ollama:
#        condition: service_healthy
#      ollama_pull:
#        condition: service_completed_successfully
    environment:
      <<: *shared-environment
      RUN_DB_SETUP: "false"
      LOAD_FIXTURES: "false"

#      LOCAL_LLM_BACKEND: ${LOCAL_LLM_BACKEND:-ollama}
#      LOCAL_QWEN_MODEL: ${LOCAL_QWEN_MODEL:-qwen2.5:7b-instruct}
#      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    stop_grace_period: 120s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    logging: *default-logging


  celery_beat:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    restart: unless-stopped
    command:
      - celery
      - "-A"
      - project
      - beat
      - --loglevel=info
      - --schedule=/data/celerybeat-schedule
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      <<: *shared-environment
      RUN_DB_SETUP: "false"
      LOAD_FIXTURES: "false"
    volumes:
      - celery_beat_data:/data
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    logging: *default-logging

    # Development-only bind mount. See note under celery service.
    # volumes:
    #   - ..:/democracy

  flower:
    # Flower is disabled by default because it is powerful and should be protected.
    # Start it explicitly with:
    #   docker compose --profile monitoring up -d flower
    profiles: [ "monitoring" ]
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    restart: unless-stopped
    command:
      - celery
      - "-A"
      - project
      - flower
      - --port=5555
      - --address=0.0.0.0
      - --basic-auth=${FLOWER_USERNAME}:${FLOWER_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *shared-environment
      RUN_DB_SETUP: "false"
      LOAD_FIXTURES: "false"
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    logging: *default-logging

    # Do not expose Flower publicly.
    # If you need local access, use localhost only:
    # ports:
    #   - "127.0.0.1:5555:5555"

    # If exposing Flower even internally:
    # Add basic auth or put it behind Cloudflare Access.
    # Example:
    # command:
    #   - celery
    #   - "-A"
    #   - project
    #   - flower
    #   - --port=5555
    #   - --address=0.0.0.0
    #   - --basic-auth=${FLOWER_USERNAME}:${FLOWER_PASSWORD}

  tunnel:
    image: cloudflare/cloudflared:2026.7.3
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
    logging: *default-logging

volumes:
  postgres_data:
  celery_beat_data:
  media_data:
  ollama_data:

networks:
  frontend:
  backend: